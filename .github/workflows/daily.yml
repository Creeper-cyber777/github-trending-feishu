name: GitHub Trending Daily Push

# 触发方式：
#   schedule          —— 每天三个时间点，前一个为主、后两个兜底
#   workflow_dispatch —— 手动触发，便于验证与补发
on:
  schedule:
    # GitHub 的 cron 一律使用 UTC。北京时间 = UTC+8。
    - cron: '0 1 * * *'    # 北京 09:00（主）
    - cron: '40 1 * * *'   # 北京 09:40（兜底一）
    - cron: '20 2 * * *'   # 北京 10:20（兜底二）
  workflow_dispatch:
    inputs:
      limit:
        description: '推送条数'
        required: false
        default: '15'
      since:
        description: '抓取周期 (daily / weekly / monthly)'
        required: false
        default: 'daily'
      dry_run:
        description: '仅生成内容、不发送到飞书 (true/false)'
        required: false
        default: 'false'
      force:
        description: '忽略当天去重、强制重发 (true/false)'
        required: false
        default: 'false'

concurrency:
  group: trending-push
  cancel-in-progress: false

permissions:
  contents: read

env:
  TRENDING_STATE_DIR: ${{ github.workspace }}/.trending-state

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore push state
        uses: actions/cache/restore@v4
        with:
          path: .trending-state
          key: trending-state-${{ github.run_id }}
          restore-keys: |
            trending-state-

      - name: Run digest
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          TRENDING_ARCHIVE_DIR: ${{ github.workspace }}/artifact
        run: |
          set -euo pipefail
          LIMIT="${{ github.event.inputs.limit || '15' }}"
          SINCE="${{ github.event.inputs.since || 'daily' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"

          ARGS=("--limit" "$LIMIT" "--since" "$SINCE")
          if [ "$DRY" = "true" ]; then ARGS+=("--dry-run"); fi
          if [ "$FORCE" = "true" ]; then ARGS+=("--force"); fi

          node daily.js "${ARGS[@]}"

      - name: Save push state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .trending-state
          key: trending-state-${{ github.run_id }}

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trending-digest-${{ github.run_number }}
          path: artifact/
          retention-days: 14
          if-no-files-found: ignore
