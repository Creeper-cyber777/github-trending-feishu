name: GitHub Trending Daily Push

on:
  schedule:
    # 北京时间 = UTC+8。以下 4 个 UTC 小时对应北京 09:00–12:59。
    - cron: '*/20 1-4 * * *'
    # 保底：若白天 12 次全部被 GitHub 丢弃，20:00（北京）再补一次。
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: '推送条数'
        required: false
        default: '15'
      since:
        description: '抓取周期 (daily / weekly / monthly)'
        required: false
        default: 'daily'
      dry_run:
        description: '仅生成内容、不发送到飞书 (true/false)'
        required: false
        default: 'false'
      force:
        description: '忽略当天去重、强制重发 (true/false)'
        required: false
        default: 'true'   # 手动触发默认强制执行，避免"今天已推送"导致静默跳过

concurrency:
  group: trending-push
  cancel-in-progress: false

permissions:
  contents: write

env:
  TRENDING_STATE_DIR: ${{ github.workspace }}/.trending-state

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Show clock and push state
        run: |
          echo "UTC       : $(date -u '+%Y-%m-%d %H:%M:%S')"
          echo "北京时间  : $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"
          echo "触发方式  : ${GITHUB_EVENT_NAME}"
          if [ -f .trending-state/push-state.json ]; then
            echo "已有状态记录："
            cat .trending-state/push-state.json
          else
            echo "尚无状态记录（首次运行）"
          fi

      - name: Run digest
        env:
          ZHIPU_API_KEY: ${{ secrets.ZHIPU_API_KEY }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_SECRET: ${{ secrets.FEISHU_SECRET }}
          TRENDING_ARCHIVE_DIR: ${{ github.workspace }}/artifact
        run: |
          set -euo pipefail
          LIMIT="${{ github.event.inputs.limit || '15' }}"
          SINCE="${{ github.event.inputs.since || 'daily' }}"
          DRY="${{ github.event.inputs.dry_run || 'false' }}"
          FORCE="${{ github.event.inputs.force || 'false' }}"

          ARGS=("--limit" "$LIMIT" "--since" "$SINCE")
          if [ "$DRY" = "true" ]; then ARGS+=("--dry-run"); fi
          if [ "$FORCE" = "true" ]; then ARGS+=("--force"); fi

          node daily.js "${ARGS[@]}"

      - name: Persist push state
        if: always()
        run: |
          if [ -z "$(git status --porcelain .trending-state)" ]; then
            echo "状态无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .trending-state
          git commit -m "chore(state): record push status for $(TZ=Asia/Shanghai date +%Y-%m-%d)"

          # 并发提交/基线过期时重试，避免去重状态丢失导致重复推送
          for i in 1 2 3; do
            if git push; then
              echo "状态已推送（第 $i 次尝试）"
              exit 0
            fi
            echo "push 失败，rebase 后重试（第 $i 次）"
            git pull --rebase --autostash || true
            sleep 5
          done
          echo "::error::状态推送失败，今天可能重复推送"
          exit 1

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trending-digest-${{ github.run_number }}
          path: artifact/
          retention-days: 14
          if-no-files-found: ignore
